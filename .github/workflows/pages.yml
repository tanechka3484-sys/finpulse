# Публикация сайта на GitHub Pages при каждом push в main.
# Сайт статический — сборки нет, в Pages выкладываются index.html, css/ и js/.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Одновременно идёт только одна публикация; новая не прерывает уже начатую
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Публикуем только файлы сайта, без Dockerfile, Caddyfile и прочих служебных файлов
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html css js .nojekyll _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
